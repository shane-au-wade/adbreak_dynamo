<html>
    <head>
      <title>Adbreak Dynamo Configuration</title>
      <link rel="stylesheet" href="./style.css">
    </head>
    <body>
      <div style="text-align: center;">
          <h2 class="title">Adbreak Dynamo Configuration</h2>  
      </div>

      <div class='configTile'>
        <strong>Current Settings</strong> 
        <br>
        <br>
        <div class="configRow">
          routine: <span id='routineGUI'></span>
        </div>
        <div class="configRow">
          Time Interval: <span id='intervalGUI'></span>
        </div>
      </div>
      <br>

      <div class='configTile'>
        <form id='monetizationRoutineForm'>
          <strong>Monetization Routine:</strong>
          <br>
          <input type="radio" id="general" name="routine" value="general">
          <label for="general">General</label><br>
          <input type="radio" id="noAdbreaks" name="routine" value="noAdbreaks">
          <label for="noAdbreaks">No Adbreaks</label><br>
        </form>
        <button id='updateRoutine'>Update</button>
      </div>
      <br>

      <div class='configTile'>
            <form id='timeIntervalForm'>
              <strong>Adbreak Time Interval:</strong> 
              <br>
              <input type="radio" id="4" name="timeInterval" value="4">
              <label for="4">4</label><br>
              <input type="radio" id="5" name="timeInterval" value="5">
              <label for="5">5</label><br>
              <input type="radio" id="6" name="timeInterval" value="6">
              <label for="6">6</label><br>
              <input type="radio" id="8" name="timeInterval" value="8">
              <label for="8">8</label><br>
              <input type="radio" id="10" name="timeInterval" value="10">
              <label for="10">10</label><br>
              </form>
          <button id='updateTimeInterval'>Update</button>
      </div>
      <br>

      <div class='copyContainer'>
        <button id='copyBtn' class='copyBtn'>
          <img class="copyImg" src="./img/copy.svg">
        </button>
        <div class='copyText'>Adbreak Code</div>
      </div>
  
     <script src="homePage.js"></script>
    </body>
  </html>
